<header class="public-header">
  <div class="nav-container">
    <!-- Brand Logo -->
    <a class="brand-identity" onclick="app.navigatePublic('home')">
      <div class="brand-logo-icon">
        <i data-lucide="zap" style="width: 22px; height: 22px; stroke-width: 2.5;"></i>
      </div>
      <div class="brand-text">
        <h1>Apex<span>Electro</span></h1>
        <div class="brand-subtext">Industrial Electrical Procurement</div>
      </div>
    </a>

    <!-- Live Instant Search (Desktop/Tablet) -->
    <div class="header-search">
      <div class="search-input-wrap">
        <i data-lucide="search" class="search-icon" style="width: 18px; height: 18px;"></i>
        <input type="text" id="globalSearchInput" placeholder="Search by Product, SKU, Brand (e.g. Polycab, MCB, 2.5 sq.mm)..." autocomplete="off" oninput="app.handleLiveSearch(this.value)">
      </div>
      <div class="quick-search-dropdown" id="quickSearchDropdown">
        <!-- Populated via JS -->
      </div>
    </div>

    <!-- Navigation Links (Desktop) -->
    <ul class="nav-menu">
      <li><a class="nav-link active" id="navHome" onclick="app.navigatePublic('home')">Home</a></li>
      <li><a class="nav-link" id="navCatalog" onclick="app.navigatePublic('catalog')">Products</a></li>
      <li><a class="nav-link" id="navCategories" onclick="app.navigatePublic('categories')">Categories</a></li>
      <li><a class="nav-link" id="navBrands" onclick="app.navigatePublic('brands')">Brands</a></li>
      <li><a class="nav-link" id="navAbout" onclick="app.navigatePublic('about')">About Us</a></li>
      <li><a class="nav-link" id="navContact" onclick="app.navigatePublic('contact')">Contact</a></li>
    </ul>

    <!-- Right Side: Inquiry Cart + Admin Login Lock Button + Mobile Menu Toggle -->
    <div class="header-actions">
      <button class="inquiry-btn" id="headerInquiryBtn" onclick="app.toggleInquiryDrawer(true)" title="View Material Inquiry Cart">
        <i data-lucide="clipboard-list" style="width: 18px; height: 18px;"></i>
        <span class="btn-label">Inquiry List</span>
        <span class="inquiry-badge" id="headerInquiryCount">0</span>
      </button>

      <button class="admin-lock-btn" id="headerAdminLockBtn" onclick="app.requestAdminAccess()" title="Protected Vendor Access">
        <i data-lucide="lock" style="width: 14px; height: 14px;"></i>
        <span class="btn-label" id="headerAdminBtnText">Vendor Login</span>
      </button>

      <!-- Mobile Hamburger Toggle -->
      <button class="mobile-nav-toggle" id="mobileNavToggleBtn" onclick="app.toggleMobileNav()" aria-label="Toggle navigation menu" title="Open navigation menu">
        <i data-lucide="menu" id="mobileNavToggleIcon" style="width: 22px; height: 22px;"></i>
      </button>
    </div>
  </div>

  <!-- Mobile Collapsible Navigation Panel -->
  <div class="mobile-nav-panel" id="mobileNavPanel">
    <div class="mobile-search-wrap">
      <div class="search-input-wrap">
        <i data-lucide="search" class="search-icon" style="width: 16px; height: 16px;"></i>
        <input type="text" id="mobileSearchInput" placeholder="Search products, SKUs, brands..." autocomplete="off" oninput="app.handleLiveSearch(this.value)">
      </div>
    </div>
    <ul class="mobile-nav-list">
      <li><a class="mobile-nav-item active" id="mobNavHome" onclick="app.navigatePublic('home'); app.toggleMobileNav(false);"><i data-lucide="home" style="width: 18px; height: 18px;"></i> Home Storefront</a></li>
      <li><a class="mobile-nav-item" id="mobNavCatalog" onclick="app.navigatePublic('catalog'); app.toggleMobileNav(false);"><i data-lucide="boxes" style="width: 18px; height: 18px;"></i> Products Catalog</a></li>
      <li><a class="mobile-nav-item" id="mobNavCategories" onclick="app.navigatePublic('categories'); app.toggleMobileNav(false);"><i data-lucide="layers" style="width: 18px; height: 18px;"></i> Categories & Taxonomy</a></li>
      <li><a class="mobile-nav-item" id="mobNavBrands" onclick="app.navigatePublic('brands'); app.toggleMobileNav(false);"><i data-lucide="award" style="width: 18px; height: 18px;"></i> Authorized OEM Brands</a></li>
      <li><a class="mobile-nav-item" id="mobNavAbout" onclick="app.navigatePublic('about'); app.toggleMobileNav(false);"><i data-lucide="info" style="width: 18px; height: 18px;"></i> About Apex Electro</a></li>
      <li><a class="mobile-nav-item" id="mobNavContact" onclick="app.navigatePublic('contact'); app.toggleMobileNav(false);"><i data-lucide="mail" style="width: 18px; height: 18px;"></i> Contact Sales & Engineering</a></li>
    </ul>
  </div>
</header>
