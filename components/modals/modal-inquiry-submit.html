<dialog class="custom-modal" id="inquirySubmitModal">
    <div class="modal-content-box">
      <div class="modal-header">
        <h3>
          <i data-lucide="file-text" style="color: #b45309; width: 22px; height: 22px;"></i>
          Submit B2B Material Inquiry
        </h3>
        <button class="close-drawer-btn" onclick="app.closeModal('inquirySubmitModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="inquiryForm" onsubmit="app.handleInquirySubmit(event)">
          <!-- Personal Information -->
          <h4 style="color: #b45309; font-size: 0.95rem; margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-medium); padding-bottom: 0.4rem;">
            1. Contact Representative Information
          </h4>
          <div class="form-grid-2col" style="margin-bottom: 1.5rem;">
            <div class="form-group">
              <label class="form-label" for="inqFullName">Full Name <span class="req">*</span></label>
              <input type="text" id="inqFullName" class="form-control" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
              <label class="form-label" for="inqMobile">Mobile Number <span class="req">*</span></label>
              <input type="tel" id="inqMobile" class="form-control" required placeholder="+91 98765 43210">
            </div>
            <div class="form-group">
              <label class="form-label" for="inqEmail">Official Email <span class="req">*</span></label>
              <input type="email" id="inqEmail" class="form-control" required placeholder="procurement@company.com">
            </div>
            <div class="form-group">
              <label class="form-label" for="inqCompany">Company / Organization Name</label>
              <input type="text" id="inqCompany" class="form-control" placeholder="Company / Firm name">
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="inqDesignation">Designation / Role</label>
              <input type="text" id="inqDesignation" class="form-control" placeholder="e.g. Purchase Manager / Project Engineer">
            </div>
          </div>

          <!-- Business Information -->
          <h4 style="color: #b45309; font-size: 0.95rem; margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-medium); padding-bottom: 0.4rem;">
            2. Business & Delivery Details
          </h4>
          <div class="form-grid-2col" style="margin-bottom: 1.5rem;">
            <div class="form-group">
              <label class="form-label" for="inqGst">GST Number (Optional for quote)</label>
              <input type="text" id="inqGst" class="form-control" placeholder="Enter 15-digit GSTIN (optional)">
            </div>
            <div class="form-group">
              <label class="form-label" for="inqDeliveryDate">Preferred Delivery Date</label>
              <input type="date" id="inqDeliveryDate" class="form-control">
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="inqBillingAddress">Billing Address</label>
              <input type="text" id="inqBillingAddress" class="form-control" placeholder="Registered office address for tax invoice">
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="inqDeliveryLocation">Project Site / Delivery Location</label>
              <input type="text" id="inqDeliveryLocation" class="form-control" placeholder="Site address, Plot No., City & Pincode">
            </div>
            <div class="form-group full-width">
              <label class="form-label" for="inqMessage">Additional Requirements / Technical Notes</label>
              <textarea id="inqMessage" class="form-control" rows="3" placeholder="e.g. Specify drum lengths, test report requirements, brand alternatives, or payment milestones..."></textarea>
            </div>
          </div>

          <!-- Itemized Breakdown Preview -->
          <h4 style="color: #b45309; font-size: 0.95rem; margin-bottom: 0.85rem; border-bottom: 1px solid var(--border-medium); padding-bottom: 0.4rem;">
            3. Products in this Inquiry (<span id="inqFormItemsCount">0</span> Items)
          </h4>
          <div id="inqFormItemsSummary" style="margin-bottom: 1.5rem;">
            <!-- Summary list rendered via JS -->
          </div>

          <div class="modal-footer" style="padding-left: 0; padding-right: 0; background: transparent;">
            <button type="button" class="btn-secondary" onclick="app.closeModal('inquirySubmitModal')">Cancel</button>
            <button type="submit" class="btn-primary">
              <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
              Confirm & Submit Inquiry (RFQ)
            </button>
          </div>
        </form>
      </div>
    </div>
  </dialog>
